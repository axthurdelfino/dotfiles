env TERM=xterm-256color

# --- Performance ---
input_delay 1
sync_to_monitor yes
scrollback_lines 10000

# --- Font ---
font_family      family="JetBrainsMono Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        15.0

# Disable ligatures
disable_ligatures always

# --- Mouse & Cursor ---
mouse_hide_wait 2.0
cursor_shape beam
cursor_beam_thickness 1.5
copy_on_select yes

# --- Background ---
background_opacity 0.90

# --- Window decorations ---
window_padding_width 12
hide_window_decorations yes

# --- Bell ---
enable_audio_bell no

# --- Keybindings ---
map super+1 goto_tab 1
map super+2 goto_tab 2
map super+3 goto_tab 3
map super+4 goto_tab 4
map super+5 goto_tab 5
map super+6 goto_tab 6
map super+7 goto_tab 7
map super+8 goto_tab 8
map super+9 goto_tab 9

# Use Super + { } to change tab.
map super+} next_tab
map super+{ previous_tab

# --- Layouts & Splits ---
enabled_layouts splits,stack,grid

# Split windows (opens in current working directory)
map super+d launch --location=vsplit --cwd=current
map super+shift+d launch --location=hsplit --cwd=current

# Move focus between split windows (Vim keys)
map ctrl+alt+h neighboring_window left
map ctrl+alt+l neighboring_window right
map ctrl+alt+k neighboring_window up
map ctrl+alt+j neighboring_window down

# Resize split windows (Arrow keys)
map alt+shift+left resize_window narrower 2
map alt+shift+right resize_window wider 2
map alt+shift+up resize_window taller 2
map alt+shift+down resize_window shorter 2

# Toggle zoom/maximize the active split window (like tmux zoom)
map ctrl+alt+z toggle_layout stack

tab_bar_min_tabs            2
tab_bar_edge                bottom
tab_bar_style               separator
tab_separator               " │ "
active_tab_font_style       bold
inactive_tab_font_style     normal

# GitLab Dark Grey Theme
include gitlab-dark-grey.conf

include ${KITTY_OS}.conf
